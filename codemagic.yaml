workflows:
  camguard-android-debug:
    name: CamGuard Android APK (debug)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: v22.16.0
    scripts:
      - name: Clean npm cache
        script: |
          npm cache clean --force
      - name: Install dependencies
        script: |
          npm install --no-audit --no-fund --legacy-peer-deps
      - name: Install Capacitor 8
        script: |
          npm install --no-save --legacy-peer-deps --no-audit --no-fund @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8
      - name: Build web app
        script: |
          npm run build
      - name: Generate Android project if absent
        script: |
          if [ ! -d android ]; then
            npx cap add android
          fi
      - name: Sync web app to Android
        script: |
          npx cap sync android
      - name: Configure Android SDK path
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
