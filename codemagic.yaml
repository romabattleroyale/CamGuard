workflows:
  camguard-android-debug:
    name: CamGuard Android APK (debug)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: v22.16.0
      java: 21
    scripts:
      - name: Clean npm cache
        script: |
          npm cache clean --force
      - name: Install dependencies
        script: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run lint
      - name: Install Capacitor 8
        script: |
          npm install --no-save --legacy-peer-deps --no-audit --no-fund @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8
      - name: Build web app
        script: |
          npm run build
      - name: Generate Android project if absent
        script: |
          if [ ! -d android ]; then
            npx cap add android
          fi
      - name: Add Android camera and microphone permissions
        script: |
          MANIFEST="$CM_BUILD_DIR/android/app/src/main/AndroidManifest.xml"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />'
          ]
          anchor = "<application"
          missing = [x for x in permissions if x not in s]
          if missing:
              s = s.replace(anchor, "\n    " + "\n    ".join(missing) + "\n\n    " + anchor, 1)
              p.write_text(s)
          final_xml = p.read_text()
          required = ["android.permission.CAMERA", "android.permission.RECORD_AUDIO"]
          missing_after = [permission for permission in required if permission not in final_xml]
          if missing_after:
              raise SystemExit("Missing Android permissions: " + ", ".join(missing_after))
          print("Verified camera and microphone permissions in AndroidManifest.xml")
          PY
      - name: Sync web app to Android
        script: |
          npx cap sync android
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          required = ["android.permission.CAMERA", "android.permission.RECORD_AUDIO"]
          missing = [permission for permission in required if permission not in xml]
          if missing:
              raise SystemExit("Capacitor sync removed required permissions: " + ", ".join(missing))
          print("Camera/microphone permissions verified after Capacitor sync.")
          PY
      - name: Configure Android SDK path
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build debug APK
        script: |
          java -version
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
