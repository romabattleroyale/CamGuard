name: Playwright visual tests

on:
  push:
    branches: [codemagic/android-apk]
    paths:
      - 'src/**'
      - 'index.html'
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tests/e2e/**'
      - '.github/workflows/playwright.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Type check
        run: npm run lint
      - name: Build web app
        run: npm run build
      - name: Run screenshot tests
        run: npm run test:e2e
      - name: Upload screenshots, traces and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camguard-playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
